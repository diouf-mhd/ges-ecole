# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD Pipeline - GesEcole

on:
  push:
    branches: [ "develop", "main" ]

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, vps-lab ]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build de l'application Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construction de l'image Docker
        run: docker build -t ges-ecole-app:latest .

      - name: Redéploiement du conteneur
        run: |
          docker stop ges-ecole-container 2>/dev/null || true
          docker rm ges-ecole-container 2>/dev/null || true
          docker run -d --name ges-ecole-container -p 8080:8080 ges-ecole-app:latest